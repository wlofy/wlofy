<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img"
     aria-label="Terminal card: Saad Karim, AI graduate from FAST NUCES, focused on LLMs, agents and applied ML.">
  <style>
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .k { fill: #39d353; }
    .v { fill: #c9d1d9; }
    .dim { fill: #7d8590; }
    .row { opacity: 0; animation: in .45s ease-out forwards; }
    .r1 { animation-delay: .15s } .r2 { animation-delay: .35s } .r3 { animation-delay: .55s }
    .r4 { animation-delay: .75s } .r5 { animation-delay: .95s } .r6 { animation-delay: 1.15s }
    .r7 { animation-delay: 1.40s }
    @keyframes in { from { opacity: 0; transform: translateX(-10px) } to { opacity: 1; transform: none } }
    .cursor { fill: #39d353; opacity: 0; animation: blink 1.1s steps(1) 1.7s infinite }
    @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .row { animation: none; opacity: 1 } .cursor { animation: none; opacity: 1 }
    }
  </style>

  <rect x="1" y="1" width="718" height="318" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M1 11a10 10 0 0 1 10-10h698a10 10 0 0 1 10 10v27H1z" fill="#161b22"/>
  <line x1="1" y1="38" x2="719" y2="38" stroke="#30363d"/>
  <circle cx="22" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="20" r="5" fill="#27c93f"/>
  <text class="mono dim" x="82" y="25" font-size="13">saad@github: ~/whoami</text>

  <g class="mono" font-size="14">
    <g class="row r1"><text class="k" x="30" y="86">Now</text><text class="v" x="140" y="86">AI graduate — FAST NUCES, Pakistan</text></g>
    <g class="row r2"><text class="k" x="30" y="118">Focus</text><text class="v" x="140" y="118">LLMs · agents · applied ML</text></g>
    <g class="row r3"><text class="k" x="30" y="150">Stack</text><text class="v" x="140" y="150">Python · PyTorch · FastAPI · React</text></g>
    <g class="row r4"><text class="k" x="30" y="182">Shipped</text><text class="v" x="140" y="182">LLMPDF (31★) · FilingLens · Pulse Messenger</text></g>
    <g class="row r5"><text class="k" x="30" y="214">Loop</text><text class="v" x="140" y="214">solve → experiment → learn → repeat</text></g>
    <g class="row r6"><text class="k" x="30" y="246">Reach</text><text class="v" x="140" y="246">saadkarim924@gmail.com</text></g>
    <g class="row r7">
      <text class="k" x="30" y="284">$</text>
      <text class="v" x="52" y="284">building something new</text>
      <rect class="cursor" x="245" y="272" width="8" height="16"/>
    </g>
  </g>
</svg>
